name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Inject version
        shell: bash
        run: echo '__version__ = "${{ steps.version.outputs.version }}"' > src/__init__.py

      - name: Inject drive credentials
        shell: bash
        run: |
          cat > src/drive_credentials.py << EOF
          CLIENT_CONFIG = {
              "installed": {
                  "client_id": "${{ secrets.DRIVE_CLIENT_ID }}",
                  "client_secret": "${{ secrets.DRIVE_CLIENT_SECRET }}",
                  "project_id": "dnd-logger-487422",
                  "auth_uri": "https://accounts.google.com/o/oauth2/auth",
                  "token_uri": "https://oauth2.googleapis.com/token",
                  "redirect_uris": ["http://localhost"],
              }
          }
          SCOPES = ["https://www.googleapis.com/auth/drive"]
          EOF

      - name: Build with PyInstaller
        run: pyinstaller dnd_logger.spec --noconfirm

      - name: Build installer
        run: iscc /DMyAppVersion=${{ steps.version.outputs.version }} installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer_output/DnDLogger_Setup_${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

  build-macos:
    # Apple Silicon runner: the app is built for arm64 Macs
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Inject version
        run: echo '__version__ = "${{ steps.version.outputs.version }}"' > src/__init__.py

      - name: Inject drive credentials
        run: |
          cat > src/drive_credentials.py << EOF
          CLIENT_CONFIG = {
              "installed": {
                  "client_id": "${{ secrets.DRIVE_CLIENT_ID }}",
                  "client_secret": "${{ secrets.DRIVE_CLIENT_SECRET }}",
                  "project_id": "dnd-logger-487422",
                  "auth_uri": "https://accounts.google.com/o/oauth2/auth",
                  "token_uri": "https://oauth2.googleapis.com/token",
                  "redirect_uris": ["http://localhost"],
              }
          }
          SCOPES = ["https://www.googleapis.com/auth/drive"]
          EOF

      - name: Build with PyInstaller
        run: pyinstaller dnd_logger.spec --noconfirm

      - name: Build disk image
        run: |
          mkdir dmg
          cp -R "dist/DnD Logger.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "DnD Logger" -srcfolder dmg -ov -format UDZO \
            "DnDLogger_${{ steps.version.outputs.version }}_macOS.dmg"

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: DnDLogger_${{ steps.version.outputs.version }}_macOS.dmg
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
